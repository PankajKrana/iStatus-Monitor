name: macOS Build

# Continuous Integration for iStatus Monitor (macOS SwiftUI app).
#
# Triggers:
#   - Pushes to `develop`                  (validate integration branch)
#   - Pull requests targeting `develop`    (validate feature/* before merge)
#   - Pull requests targeting `main`       (validate release candidates)
#
# Intentionally NOT triggered by direct pushes to `main`: `main` is updated
# only through reviewed pull requests, which are already validated above.
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: this workflow only needs to read the repository contents.
permissions:
  contents: read

env:
  PROJECT: "iStatus Monitor.xcodeproj"
  SCHEME: "iStatus Monitor"

jobs:
  build:
    name: Build (macOS)
    # iStatus Monitor targets macOS 26 (Tahoe) and requires the Xcode 26 SDK.
    # `macos-latest` currently maps to macOS 15 / Xcode 16, whose older SDK
    # cannot build a macOS-26 target. `macos-26` is the newest GitHub-hosted
    # image and ships the Xcode 26 toolchain this project needs. The project's
    # deployment target is 26.0 (not 26.x.y) so the test bundle can actually run
    # on the runner's OS — testing requires deployment target <= runner macOS.
    runs-on: macos-26

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        # Pin the newest Xcode 26 on the image for a stable, reproducible SDK
        # (the macos-26 default has historically been an earlier 26.x). Any
        # Xcode-26 SDK satisfies the 26.0 deployment target; 26.5 also matches
        # the local dev toolchain. Falls back to the default Xcode if 26.5 is
        # ever dropped from the image, so the build doesn't break on rotation.
        run: |
          if [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -switch /Applications/Xcode_26.5.app
          else
            echo "Xcode_26.5.app not found; using image default $(xcode-select -p)"
          fi

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          # Xcode resolves SPM packages into DerivedData/SourcePackages and a
          # shared SwiftPM cache. Caching both avoids re-downloading/re-building
          # dependencies on every run.
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          # Key off Package.resolved so the cache invalidates when dependencies
          # change. The glob tolerates the file not existing yet (no SPM deps).
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift packages
        # Pre-resolve so dependency resolution failures surface as a distinct,
        # readable step rather than being buried in the build log. No-op until
        # the project gains SPM dependencies.
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Build
        run: |
          set -o pipefail
          # Prettify output with xcbeautify when available (preinstalled on the
          # GitHub macOS runner); fall back to raw xcodebuild output otherwise.
          # `pipefail` ensures a compile failure fails the step even when piped.
          build() {
            xcodebuild build \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -destination 'platform=macOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          }
          if command -v xcbeautify >/dev/null 2>&1; then
            build | xcbeautify
          else
            build
          fi

      - name: Test
        run: |
          set -o pipefail
          # Runs the shared scheme's test action (Swift Testing) on macOS. Reuses
          # the artifacts from the Build step, and fails the job on any test
          # failure or compile error in the test target. Parallel testing is
          # disabled: SystemMonitorServiceTests spin up real hardware-polling
          # services, and running many concurrently contends on the SMC/IOKit.
          test() {
            xcodebuild test \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -destination 'platform=macOS' \
              -parallel-testing-enabled NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          }
          if command -v xcbeautify >/dev/null 2>&1; then
            test | xcbeautify
          else
            test
          fi
